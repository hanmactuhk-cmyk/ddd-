name: Build HNStudio Musik AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Release x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check tools
        shell: pwsh
        run: |
          Write-Host "MSVC:"
          where.exe cl

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "CMakeLists.txt")) {
            Write-Error "CMakeLists.txt not found"
            exit 1
          }

          if (!(Test-Path "Source")) {
            Write-Error "Source folder not found"
            exit 1
          }

          Write-Host "Project structure OK"

      - name: Configure Release
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          cmake `
            -S . `
            -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configure failed"
            exit $LASTEXITCODE
          }

      - name: Build Release
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release build failed"
            exit $LASTEXITCODE
          }

      - name: Find application
        shell: pwsh
        run: |
          Write-Host "Searching for EXE..."

          $files = Get-ChildItem `
            -Path "build" `
            -Filter "*.exe" `
            -Recurse `
            -File |
            Where-Object {
              $_.Name -notmatch "uninstall"
            }

          if ($files.Count -eq 0) {
            Write-Error "No EXE was generated"

            Write-Host "Build contents:"
            Get-ChildItem "build" -Recurse |
              Select-Object FullName

            exit 1
          }

          Write-Host "EXE files found:"
          $files | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Prepare package
        shell: pwsh
        run: |
          if (Test-Path "package") {
            Remove-Item "package" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "package" `
            -Force | Out-Null

      - name: Copy application
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path "build" `
            -Filter "*.exe" `
            -Recurse `
            -File |
            Where-Object {
              $_.Name -notmatch "uninstall"
            } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "Application EXE not found"
            exit 1
          }

          Write-Host "Using:"
          Write-Host $exe.FullName

          Copy-Item `
            $exe.FullName `
            "package\HNStudio-Musik-AI.exe" `
            -Force

      - name: Copy Assets
        shell: pwsh
        run: |
          if (Test-Path "Assets") {
            Copy-Item `
              "Assets" `
              "package\Assets" `
              -Recurse `
              -Force
          }

      - name: Copy README
        shell: pwsh
        run: |
          if (Test-Path "README.md") {
            Copy-Item `
              "README.md" `
              "package\README.md" `
              -Force
          }

      - name: Check Debug Runtime dependency
        shell: pwsh
        run: |
          $exe = "package\HNStudio-Musik-AI.exe"

          if (!(Test-Path $exe)) {
            Write-Error "EXE not found"
            exit 1
          }

          Write-Host "Checking for Debug CRT..."

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue

          if ($null -ne $dumpbin) {
            dumpbin /DEPENDENTS $exe | Out-File "dependencies.txt"

            $debugRuntime = Select-String `
              -Path "dependencies.txt" `
              -Pattern "ucrtbased.dll|vcruntime.*d.dll|msvcp.*d.dll"

            if ($debugRuntime) {
              Write-Error "Debug runtime dependency detected!"
              Get-Content "dependencies.txt"
              exit 1
            }

            Write-Host "No Debug CRT dependency detected."
          }
          else {
            Write-Host "dumpbin not available; continuing."
          }

      - name: Verify package
        shell: pwsh
        run: |
          if (!(Test-Path "package\HNStudio-Musik-AI.exe")) {
            Write-Error "Final EXE is missing"
            exit 1
          }

          Write-Host ""
          Write-Host "=============================="
          Write-Host "PACKAGE"
          Write-Host "=============================="

          Get-ChildItem `
            "package" `
            -Recurse |
            Select-Object FullName, Length

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "HNStudio-Musik-AI-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            Write-Error "ZIP creation failed"
            exit 1
          }

          Write-Host ""
          Write-Host "ZIP CREATED:"
          Write-Host $zip
          Write-Host "Size: $((Get-Item $zip).Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNStudio-Musik-AI-Windows-x64
          path: HNStudio-Musik-AI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
